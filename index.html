<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Essentials</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F7F5F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Essentials">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
  :root {
    --paper: #F7F5F0;
    --card: #FFFFFF;
    --ink: #202B24;
    --muted: #6E7A70;
    --line: #E4E0D6;
    --pine: #1E4638;
    --amber: #C08A2E;
    --slate: #6B8494;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 18px 16px 110px; }

  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }

  .back-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none; padding: 0;
    font-family: inherit; font-size: 15px; font-weight: 600;
    color: var(--ink); cursor: pointer;
  }
  .back-btn .chev { font-size: 19px; line-height: 1; color: var(--muted); }

  .month-select-wrap { position: relative; flex-shrink: 0; }
  select#monthSelect {
    appearance: none; -webkit-appearance: none;
    font-family: inherit; font-size: 14px; font-weight: 600;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 28px 8px 12px; cursor: pointer;
  }
  .month-select-wrap::after {
    content: '▾'; position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%); pointer-events: none;
    color: var(--muted); font-size: 12px;
  }

  .chart-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 22px 16px 16px;
    margin-bottom: 16px; text-align: center;
  }
  .donut-wrap { position: relative; width: 176px; height: 176px; margin: 0 auto; }
  .donut-center {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .donut-figure { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .donut-label { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  #donutArcs circle { cursor: pointer; transition: opacity .15s; }
  #donutArcs circle:active { opacity: .7; }

  .legend { margin-top: 14px; }
  .legend-btn {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; gap: 10px; padding: 10px 4px;
    background: none; border: none; border-bottom: 1px solid var(--line);
    font-family: inherit; font-size: 14px; color: var(--ink); cursor: pointer;
  }
  .legend-btn:last-child { border-bottom: none; }
  .legend-left { display: flex; align-items: center; gap: 9px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-right { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .legend-amt { font-weight: 600; color: var(--ink); }
  .legend-chev { font-size: 15px; color: var(--muted); }
  .legend-btn.empty-cat { opacity: .45; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 6px 16px 10px; margin-bottom: 16px;
  }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
  .items { list-style: none; margin: 0; padding: 0; }
  .item { border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: none; }
  .item-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 0; cursor: pointer; gap: 10px;
  }
  .item-name-wrap { min-width: 0; display: flex; align-items: center; gap: 11px; flex: 1; }
  .item-name {
    font-size: 15px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-amount { font-size: 15px; font-weight: 600; flex-shrink: 0; }

  .tick {
    width: 23px; height: 23px; border-radius: 50%;
    border: 2px solid var(--c, var(--pine)); background: transparent;
    flex-shrink: 0; padding: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; color: transparent;
  }
  .tick.on { background: var(--c, var(--pine)); color: #fff; }
  .item.paid .item-name, .item.paid .item-amount {
    color: var(--muted); text-decoration: line-through;
  }

  .paid-summary { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; }
  .paid-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 16px 0 0;
  }
  .paid-head h2 { margin: 0; }
  .paid-head .paid-total { font-size: 13px; font-weight: 600; color: var(--muted); }
  .item-detail { display: none; padding: 0 0 13px 19px; font-size: 13px; color: var(--muted); }
  .item-detail.open { display: block; }
  .item-meta { margin-bottom: 4px; }
  .item-meta.soon { color: var(--amber); font-weight: 600; }
  .detail-actions { display: flex; gap: 16px; margin-top: 8px; }
  .detail-link {
    font-size: 13px; background: none; border: none; padding: 0;
    font-family: inherit; cursor: pointer; text-decoration: underline;
  }
  .detail-link.edit { color: var(--pine); }
  .detail-link.remove { color: #A23B3B; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 20px 0; }

  .fab {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    right: 50%; transform: translateX(calc(240px - 56px));
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--pine); color: white; border: none;
    font-size: 28px; line-height: 1;
    box-shadow: 0 6px 16px rgba(30,70,56,0.35); cursor: pointer;
  }
  @media (max-width: 520px) { .fab { right: 20px; transform: none; } }

  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(20,26,22,0.45);
    align-items: flex-end; justify-content: center; z-index: 10;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--paper); width: 100%; max-width: 480px;
    border-radius: 18px 18px 0 0;
    padding: 18px 18px calc(28px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto;
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .sheet-head h3 { margin: 0; font-size: 17px; }
  .close-x { background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer; }

  .seg { display: flex; gap: 7px; margin-top: 6px; }
  .seg-btn {
    flex: 1; padding: 11px 4px; text-align: center; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--card);
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    color: var(--muted); cursor: pointer;
  }
  .seg-btn:disabled { opacity: .45; }
  .seg-btn.active { color: #fff; }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  label.field-label { display: block; font-size: 12.5px; color: var(--muted); margin: 14px 0 5px; }
  input {
    font-family: inherit; font-size: 16px; padding: 12px;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--card); color: var(--ink); width: 100%;
  }
  input:focus { outline: 2px solid var(--pine); outline-offset: -1px; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn-cancel {
    flex: 1; padding: 13px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
    font-family: inherit; font-size: 15px; cursor: pointer;
  }
  .btn-save {
    flex: 2; padding: 13px; border-radius: 9px; border: none;
    background: var(--pine); color: white;
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }

  .footer-note { text-align: center; margin-top: 4px; }
  .footer-link {
    background: none; border: none; font-family: inherit; font-size: 12.5px;
    color: var(--muted); text-decoration: underline; cursor: pointer; padding: 6px;
  }
  .warn-banner {
    display: none; background: #FBEAEA; color: #8C2F2F;
    border-radius: 9px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px;
  }
  .warn-banner.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div id="titleSlot"><h1>Essentials</h1></div>
    <div class="month-select-wrap"><select id="monthSelect"></select></div>
  </div>

  <div class="warn-banner" id="warnBanner"></div>

  <div class="chart-card">
    <div class="donut-wrap">
      <svg viewBox="0 0 176 176" width="176" height="176">
        <circle cx="88" cy="88" r="72" fill="none" stroke="#E4E0D6" stroke-width="19"/>
        <g id="donutArcs" transform="rotate(-90 88 88)"></g>
      </svg>
      <div class="donut-center">
        <div class="donut-figure" id="totalFigure">£0.00</div>
        <div class="donut-label" id="totalLabel">total due</div>
      </div>
    </div>
    <p class="paid-summary" id="paidSummary"></p>
    <div class="legend" id="legend"></div>
  </div>

  <div class="card">
    <h2 id="listHeading">Still to pay</h2>
    <ul class="items" id="itemsList"></ul>
    <p class="empty" id="emptyMsg">Nothing added for this month yet.</p>

    <div id="paidSection" style="display:none;">
      <div class="paid-head">
        <h2>Paid</h2>
        <span class="paid-total" id="paidTotal"></span>
      </div>
      <ul class="items" id="paidList"></ul>
    </div>
  </div>

  <div class="footer-note">
    <button class="footer-link" id="exportLink">Back up my data</button>
  </div>
</div>

<button class="fab" id="fabBtn" aria-label="Add cost">+</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="sheetTitle">Add a cost</h3>
      <button class="close-x" id="closeSheet">✕</button>
    </div>

    <label class="field-label" style="margin-top:8px;">Priority</label>
    <div class="seg" id="catSeg">
      <button class="seg-btn" data-cat="essential">Essential</button>
      <button class="seg-btn" data-cat="wanted">Wanted</button>
      <button class="seg-btn" data-cat="optional">Optional</button>
    </div>

    <label class="field-label">How often</label>
    <div class="seg" id="freqSeg">
      <button class="seg-btn" data-freq="recurring">Recurring</button>
      <button class="seg-btn" data-freq="oneoff">One-off</button>
    </div>
    <p class="hint" id="freqHint">Counts towards every month.</p>

    <label class="field-label">Name</label>
    <input id="inputName" type="text" placeholder="e.g. Rent, Car repair" autocomplete="off">

    <label class="field-label">Amount</label>
    <input id="inputAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="£ amount">

    <label class="field-label" id="dateFieldLabel">Due day of month (optional)</label>
    <input id="inputDay" type="number" inputmode="numeric" min="1" max="31" placeholder="e.g. 15">
    <input id="inputDate" type="date" style="display:none;">

    <div class="sheet-actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-save" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
const KEY = 'essentials-v1';

const CATS = {
  essential: { label: 'Essential', color: '#1E4638' },
  wanted:    { label: 'Wanted',    color: '#C08A2E' },
  optional:  { label: 'Optional',  color: '#6B8494' }
};
const CAT_ORDER = ['essential','wanted','optional'];

let recurring = [], oneOff = [];
let paid = {};   // key: "itemId|YYYY-MM" -> true
let viewDate = new Date(); viewDate.setDate(1);
let drillCat = null;
let expandedId = null;
let editingId = null, editingKind = null;
let formCat = 'essential', formFreq = 'recurring';
let emptyBaseMsg = 'Nothing added for this month yet.';

const $ = id => document.getElementById(id);
const money = n => '£' + n.toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
const mkOf = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
const isThisMonth = () => mkOf(viewDate) === mkOf(new Date());
const ord = n => { const s=['th','st','nd','rd'], v=n%100; return s[(v-20)%10]||s[v]||s[0]; };
const catOf = it => CATS[it.category] ? it.category : 'essential';

function warn(msg) {
  const b = $('warnBanner');
  if (msg) { b.textContent = msg; b.classList.add('show'); }
  else { b.classList.remove('show'); }
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify({recurring, oneOff, paid})); warn(null); }
  catch (e) { warn("Couldn't save. If you're in Private Browsing, switch to a normal tab."); }
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      recurring = Array.isArray(d.recurring) ? d.recurring : [];
      oneOff = Array.isArray(d.oneOff) ? d.oneOff : [];
      paid = (d.paid && typeof d.paid === 'object') ? d.paid : {};
      [...recurring, ...oneOff].forEach(i => { if (!CATS[i.category]) i.category = 'essential'; });
    }
    warn(null);
  } catch (e) { warn("Couldn't load saved data on this device."); }
}

const paidKey = item => item.id + '|' + mkOf(viewDate);
const isPaid = item => paid[paidKey(item)] === true;

function togglePaid(item) {
  const k = paidKey(item);
  if (paid[k]) delete paid[k]; else paid[k] = true;
  expandedId = null;
  save(); render();
}

function populateMonths() {
  const sel = $('monthSelect');
  sel.innerHTML = '';
  const base = new Date(); base.setDate(1);
  for (let o = -6; o <= 18; o++) {
    const d = new Date(base.getFullYear(), base.getMonth()+o, 1);
    const opt = document.createElement('option');
    opt.value = mkOf(d);
    opt.textContent = d.toLocaleDateString('en-GB', {month:'long', year:'numeric'});
    if (mkOf(d) === mkOf(viewDate)) opt.selected = true;
    sel.appendChild(opt);
  }
}

$('monthSelect').addEventListener('change', e => {
  const [y,m] = e.target.value.split('-').map(Number);
  viewDate = new Date(y, m-1, 1);
  expandedId = null;
  render();
});

function monthItems() {
  const mk = mkOf(viewDate);
  return [
    ...recurring.map(i => ({...i, kind:'recurring'})),
    ...oneOff.filter(i => i.monthKey === mk).map(i => ({...i, kind:'oneoff'}))
  ];
}

function dueInfo(item) {
  if (item.kind === 'recurring') {
    if (!item.day) return {text: 'Recurring · no due day set', soon: false};
    const label = `Recurring · due on the ${item.day}${ord(item.day)}`;
    if (!isThisMonth()) return {text: label, soon: false};
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth(), item.day);
    const d = Math.round((target - new Date(now.getFullYear(), now.getMonth(), now.getDate()))/86400000);
    if (d < 0) return {text: `${label} (passed)`, soon: false};
    if (d === 0) return {text: `${label} — today`, soon: true};
    if (d <= 14) return {text: `${label} — ${d} day${d===1?'':'s'} away`, soon: true};
    return {text: label, soon: false};
  }
  if (!item.date) return {text: 'One-off · no date set', soon: false};
  const due = new Date(item.date + 'T00:00:00');
  const label = 'One-off · due ' + due.toLocaleDateString('en-GB', {day:'numeric', month:'long'});
  if (!isThisMonth()) return {text: label, soon: false};
  const today = new Date(); today.setHours(0,0,0,0);
  const d = Math.round((due - today)/86400000);
  if (d < 0) return {text: `${label} (overdue)`, soon: true};
  if (d === 0) return {text: `${label} — today`, soon: true};
  if (d <= 14) return {text: `${label} — ${d} day${d===1?'':'s'} away`, soon: true};
  return {text: label, soon: false};
}

function shade(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const mix = c => Math.round(c + (255 - c) * amount);
  return '#' + [mix(r), mix(g), mix(b)].map(c => c.toString(16).padStart(2,'0')).join('');
}

function drawDonut(segments) {
  const g = $('donutArcs');
  g.innerHTML = '';
  const total = segments.reduce((s,x) => s + x.value, 0);
  if (total <= 0) return;
  const r = 72, C = 2 * Math.PI * r;
  let offset = 0;
  segments.forEach(seg => {
    if (seg.value <= 0) return;
    const len = C * (seg.value / total);
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',88); c.setAttribute('cy',88); c.setAttribute('r',r);
    c.setAttribute('fill','none'); c.setAttribute('stroke', seg.color);
    c.setAttribute('stroke-width','19');
    c.setAttribute('stroke-dasharray', `${len} ${C - len}`);
    c.setAttribute('stroke-dashoffset', -offset);
    if (seg.onClick) c.addEventListener('click', seg.onClick);
    g.appendChild(c);
    offset += len;
  });
}

function renderItemList(list, ul) {
  ul.innerHTML = '';

  list.forEach(item => {
    const cat = catOf(item);
    const info = dueInfo(item);
    const done = isPaid(item);
    const open = expandedId === item.id;
    const li = document.createElement('li');
    li.className = 'item' + (done ? ' paid' : '');
    li.innerHTML = `
      <div class="item-row">
        <div class="item-name-wrap">
          <button class="tick ${done?'on':''}" style="--c:${CATS[cat].color}"
                  aria-label="${done?'Mark as unpaid':'Mark as paid'}">✓</button>
          <span class="item-name"></span>
        </div>
        <div class="item-amount">${money(item.amount)}</div>
      </div>
      <div class="item-detail ${open?'open':''}">
        <div class="item-meta">${CATS[cat].label}</div>
        <div class="item-meta ${info.soon && !done ? 'soon' : ''}">${info.text}</div>
        <div class="detail-actions">
          <button class="detail-link edit">Edit</button>
          <button class="detail-link remove">Remove</button>
        </div>
      </div>`;
    li.querySelector('.item-name').textContent = item.name;
    li.querySelector('.tick').addEventListener('click', e => {
      e.stopPropagation();
      togglePaid(item);
    });
    li.querySelector('.item-row').addEventListener('click', () => {
      expandedId = open ? null : item.id;
      render();
    });
    li.querySelector('.edit').addEventListener('click', e => { e.stopPropagation(); openSheet(item); });
    li.querySelector('.remove').addEventListener('click', e => {
      e.stopPropagation();
      if (item.kind === 'recurring') recurring = recurring.filter(x => x.id !== item.id);
      else oneOff = oneOff.filter(x => x.id !== item.id);
      delete paid[item.id + '|' + mkOf(viewDate)];
      expandedId = null;
      save(); render();
    });
    ul.appendChild(li);
  });
}

function renderSplitLists(list) {
  const unpaid = list.filter(i => !isPaid(i));
  const done = list.filter(i => isPaid(i));

  renderItemList(unpaid, $('itemsList'));
  $('emptyMsg').style.display = unpaid.length ? 'none' : 'block';
  $('emptyMsg').textContent = list.length
    ? 'All paid for this month.'
    : emptyBaseMsg;

  if (done.length) {
    $('paidSection').style.display = 'block';
    $('paidTotal').textContent = money(done.reduce((s,i) => s + i.amount, 0));
    renderItemList(done, $('paidList'));
  } else {
    $('paidSection').style.display = 'none';
  }
}

function sortItems(list) {
  const k = x => x.kind === 'recurring' ? (x.day ?? 99) : (x.date ? new Date(x.date).getDate() : 99);
  return [...list].sort((a,b) => k(a) - k(b));
}

function render() {
  const items = monthItems();

  if (!drillCat) {
    $('titleSlot').innerHTML = '<h1>Essentials</h1>';
    $('listHeading').textContent = 'Still to pay';
    emptyBaseMsg = 'Nothing added for this month yet.';

    const unpaidItems = items.filter(i => !isPaid(i));
    const totals = {};
    CAT_ORDER.forEach(c => totals[c] = 0);
    unpaidItems.forEach(i => totals[catOf(i)] += i.amount);
    const remaining = CAT_ORDER.reduce((s,c) => s + totals[c], 0);
    const grand = items.reduce((s,i) => s + i.amount, 0);

    $('totalFigure').textContent = money(remaining);
    $('totalLabel').textContent = 'left to pay';
    $('paidSummary').textContent = grand > 0
      ? `${money(grand - remaining)} paid of ${money(grand)}`
      : '';

    drawDonut(CAT_ORDER.map(c => ({
      value: totals[c],
      color: CATS[c].color,
      onClick: () => { drillCat = c; expandedId = null; render(); }
    })));

    const legend = $('legend');
    legend.innerHTML = '';
    CAT_ORDER.forEach(c => {
      const has = totals[c] > 0;
      const btn = document.createElement('button');
      btn.className = 'legend-btn' + (has ? '' : ' empty-cat');
      btn.innerHTML = `
        <span class="legend-left">
          <span class="dot" style="background:${CATS[c].color}"></span>
          <span>${CATS[c].label}</span>
        </span>
        <span class="legend-right">
          <span class="legend-amt">${money(totals[c])}</span>
          <span class="legend-chev">›</span>
        </span>`;
      btn.addEventListener('click', () => { drillCat = c; expandedId = null; render(); });
      legend.appendChild(btn);
    });

    renderSplitLists(sortItems(items));
    return;
  }

  // Drilled into one category
  const cat = drillCat;
  const catItems = sortItems(items.filter(i => catOf(i) === cat));
  const unpaidCat = catItems.filter(i => !isPaid(i));
  const catTotal = catItems.reduce((s,i) => s + i.amount, 0);
  const catRemaining = unpaidCat.reduce((s,i) => s + i.amount, 0);

  $('titleSlot').innerHTML = `<button class="back-btn" id="backBtn"><span class="chev">‹</span>${CATS[cat].label}</button>`;
  $('backBtn').addEventListener('click', () => { drillCat = null; expandedId = null; render(); });

  $('listHeading').textContent = `${CATS[cat].label} — still to pay`;
  emptyBaseMsg = `No ${CATS[cat].label.toLowerCase()} costs this month.`;

  $('totalFigure').textContent = money(catRemaining);
  $('totalLabel').textContent = 'left to pay';
  $('paidSummary').textContent = catTotal > 0
    ? `${money(catTotal - catRemaining)} paid of ${money(catTotal)}`
    : '';

  const base = CATS[cat].color;
  const n = Math.max(unpaidCat.length, 1);
  drawDonut(unpaidCat.map((it, idx) => ({
    value: it.amount,
    color: shade(base, (idx % n) * (0.55 / n)),
    onClick: () => { expandedId = expandedId === it.id ? null : it.id; render(); }
  })));

  const legend = $('legend');
  legend.innerHTML = '';
  unpaidCat.forEach((it, idx) => {
    const btn = document.createElement('button');
    btn.className = 'legend-btn';
    const pct = catRemaining > 0 ? Math.round((it.amount / catRemaining) * 100) : 0;
    btn.innerHTML = `
      <span class="legend-left">
        <span class="dot" style="background:${shade(base, (idx % n) * (0.55 / n))}"></span>
        <span></span>
      </span>
      <span class="legend-right">
        <span style="font-size:12.5px;">${pct}%</span>
        <span class="legend-amt">${money(it.amount)}</span>
      </span>`;
    btn.querySelector('.legend-left span:last-child').textContent = it.name;
    btn.addEventListener('click', () => { expandedId = expandedId === it.id ? null : it.id; render(); });
    legend.appendChild(btn);
  });

  renderSplitLists(catItems);
}

// ---- Add / edit sheet ----
function paintSeg(container, activeVal, attr, colorFor) {
  [...container.querySelectorAll('.seg-btn')].forEach(b => {
    const on = b.dataset[attr] === activeVal;
    b.classList.toggle('active', on);
    b.style.background = on ? colorFor(b.dataset[attr]) : '';
    b.style.borderColor = on ? colorFor(b.dataset[attr]) : '';
  });
}

function setCat(c) {
  formCat = c;
  paintSeg($('catSeg'), c, 'cat', v => CATS[v].color);
}

function setFreq(f) {
  formFreq = f;
  paintSeg($('freqSeg'), f, 'freq', () => '#1E4638');
  if (f === 'recurring') {
    $('freqHint').textContent = 'Counts towards every month.';
    $('dateFieldLabel').textContent = 'Due day of month (optional)';
    $('inputDay').style.display = 'block';
    $('inputDate').style.display = 'none';
  } else {
    $('freqHint').textContent = 'Counts towards one month only.';
    $('dateFieldLabel').textContent = 'Date (optional)';
    $('inputDay').style.display = 'none';
    $('inputDate').style.display = 'block';
  }
}

$('catSeg').addEventListener('click', e => {
  const b = e.target.closest('.seg-btn'); if (b) setCat(b.dataset.cat);
});
$('freqSeg').addEventListener('click', e => {
  const b = e.target.closest('.seg-btn');
  if (b && !b.disabled) setFreq(b.dataset.freq);
});

function openSheet(item) {
  const freqBtns = [...$('freqSeg').querySelectorAll('.seg-btn')];
  if (item) {
    editingId = item.id; editingKind = item.kind;
    $('sheetTitle').textContent = 'Edit cost';
    $('inputName').value = item.name;
    $('inputAmount').value = item.amount;
    setCat(catOf(item));
    setFreq(item.kind === 'recurring' ? 'recurring' : 'oneoff');
    $('inputDay').value = item.day ?? '';
    $('inputDate').value = item.date ?? '';
    freqBtns.forEach(b => b.disabled = true);
  } else {
    editingId = null; editingKind = null;
    $('sheetTitle').textContent = 'Add a cost';
    $('inputName').value = ''; $('inputAmount').value = '';
    $('inputDay').value = ''; $('inputDate').value = '';
    setCat(drillCat || 'essential');
    setFreq('recurring');
    freqBtns.forEach(b => b.disabled = false);
  }
  $('overlay').classList.add('open');
}
function closeSheet() { $('overlay').classList.remove('open'); }

$('fabBtn').addEventListener('click', () => openSheet(null));
$('closeSheet').addEventListener('click', closeSheet);
$('cancelBtn').addEventListener('click', closeSheet);
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeSheet(); });

$('saveBtn').addEventListener('click', () => {
  const name = $('inputName').value.trim();
  const amount = parseFloat($('inputAmount').value);
  if (!name || isNaN(amount) || amount <= 0) return;

  if (editingId) {
    const arr = editingKind === 'recurring' ? recurring : oneOff;
    const it = arr.find(x => x.id === editingId);
    if (it) {
      it.name = name; it.amount = amount; it.category = formCat;
      if (editingKind === 'recurring') {
        const v = $('inputDay').value;
        it.day = v ? Math.min(31, Math.max(1, parseInt(v,10))) : null;
      } else {
        const d = $('inputDate').value || null;
        it.date = d;
        it.monthKey = d ? d.slice(0,7) : it.monthKey;
      }
    }
  } else if (formFreq === 'recurring') {
    const v = $('inputDay').value;
    recurring.push({
      id: 'r' + Date.now(), name, amount, category: formCat,
      day: v ? Math.min(31, Math.max(1, parseInt(v,10))) : null
    });
  } else {
    const d = $('inputDate').value || null;
    oneOff.push({
      id: 'o' + Date.now(), name, amount, category: formCat,
      date: d, monthKey: d ? d.slice(0,7) : mkOf(viewDate)
    });
  }
  expandedId = null;
  save(); render(); closeSheet();
});

$('exportLink').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({recurring, oneOff, paid}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'essentials-backup.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

[$('inputName'), $('inputAmount'), $('inputDay')].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') $('saveBtn').click(); });
});

load();
populateMonths();
setCat('essential');
setFreq('recurring');
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    // Check for a new version each time the app is opened or refocused.
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) reg.update().catch(() => {});
    });
  }).catch(() => {});

  // When a new service worker takes over, reload once to pick up the new page.
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}
</script>
